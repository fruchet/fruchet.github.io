name: Build publications

on:
  push:
    branches: [main]
    paths:
      - '_data/publications.bib'
      - 'scripts/build_publications.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "bibtexparser<2" pyyaml
      - run: python scripts/build_publications.py
      - name: Commit generated YAML
        run: |
          if [[ -n "$(git status --porcelain _data/publications.yml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/publications.yml
            git commit -m "Update publications.yml from bib"
            git push
          fi
